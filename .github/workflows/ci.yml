name: CI

on:
  push:
    branches: [main, fix-release-readiness]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Compile Python files
        run: python -m compileall -q backend data_collection inference training utils tests
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
